# Runs the test suite on Windows (HogWatch uses Windows-only APIs: ICMP via
# iphlpapi and ETW) for every pull request and every push to main.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Dashboard script syntax
        run: node --check hogwatch/static/app.js
