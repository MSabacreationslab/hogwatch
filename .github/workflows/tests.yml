# Runs the test suite on Windows (HogWatch uses Windows-only APIs: ICMP via
# iphlpapi and ETW) for every pull request and every push to main.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Dashboard script syntax
        run: node --check hogwatch/static/app.js

  # Builds HogWatch.exe and runs it, so a packaging problem shows up in the pull
  # request rather than on release day.
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build HogWatch.exe
        run: cmd /c build-exe.cmd

      - name: Run the exe
        shell: pwsh
        run: ./scripts/smoke_test_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HogWatch-exe
          path: dist/HogWatch.exe
          retention-days: 7
